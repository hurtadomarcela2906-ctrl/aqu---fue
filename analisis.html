<style>
:root{--bg:#FFF9F2;--card:#FFFFFF;--ink:#2A1F1D;--muted:#7A6A64;--line:#EADFD3;--red:#C8202B;--red-s:#FBE6E8;--gold:#E0A020;--gold-s:#FFF1D0;--ok:#1F7A3A;--ok-s:#E2F3E7;--bad:#B3202B;--chip:#F6EDE2;--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
header.top{background:#fff;border-bottom:3px solid var(--red);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header.top img{height:42px;width:auto;display:block}
header.top .tt{flex:1;font:700 18px var(--head);color:var(--red);line-height:1.1}
header.top .tt small{display:block;font:600 12px var(--body);color:var(--muted)}
main{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
h2{font:700 22px var(--head);margin:22px 0 10px;color:var(--ink)}
h3{font:700 13px var(--body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 14px}
.card.red{background:var(--red-s);border-color:var(--red)}
.card.gold{background:var(--gold-s);border-color:var(--gold)}
.card.ok{background:var(--ok-s);border-color:var(--ok)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:760px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:700 24px var(--head);margin-top:2px;word-break:break-word}
.kpi .s{font-size:12px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.btn{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:700 14px var(--body);cursor:pointer;min-height:40px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.55;cursor:default}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 4px}
input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:600 15px var(--body);background:#fff;color:var(--ink);min-height:42px}
.center{max-width:420px;margin:36px auto;padding:0 14px}
.bar{height:14px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--gold)}
.bar>i.ok{background:var(--ok)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font:700 12px var(--body);background:var(--chip)}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.bad{background:var(--red-s);color:var(--bad)}
.pill.gold{background:var(--gold-s);color:#8A5A00}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:700}
tr.tot td{font-weight:700;background:var(--chip)}
details summary{cursor:pointer;font-weight:700;color:var(--red)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#2A1F1D;color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.medio{display:flex;align-items:center;gap:10px;margin:8px 0}
.medio .n{width:78px;font-weight:700}
.medio .b{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.medio .b i{display:block;height:100%;background:var(--red)}
.medio .m{width:120px;text-align:right;font-weight:700}

.solo-print{display:none}
@media print{
  @page{margin:12mm}
  html,body{background:#fff!important}
  header.top{position:static;border-bottom:2px solid #C8202B}
  .no-print,#bSalir,#sub,.btn,#toast,input,details summary{display:none!important}
  .solo-print{display:block;margin:0 0 10px}
  .solo-print h1{font:700 22px var(--head);margin:0;color:#C8202B}
  .solo-print p{margin:0;color:#7A6A64;font-size:12px}
  main{max-width:none;padding:0}
  .card,.kpi{break-inside:avoid;box-shadow:none}
  h2{break-after:avoid;margin:16px 0 6px}
  tr{break-inside:avoid}
}
</style>
</head>

<script>
var S = { token: null, ym: null, res: null, cargando: false, inv: null, invCargando: false, nom: null, nomCargando: false, nomAnio: null, his: null, hisCargando: false, hisAnio: null, ref: null, refCargando: false };
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var memTok = null;

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { var n = Number(String(v === null || v === undefined ? '' : v).replace(/[^0-9,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function numI(el) { var n = parseFloat(String(el && el.value !== undefined ? el.value : '').replace(',', '.')); return isFinite(n) ? n : 0; }
function fmt(n) { n = Math.round(Number(n) || 0); var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (n < 0 ? '-$' : '$') + s; }
function pct1(n) { return (isFinite(n) ? (n * 100).toFixed(1).replace('.', ',') : '0,0') + '%'; }
function pct(n) { return (isFinite(n) ? (n * 100).toFixed(0) : '0') + '%'; }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function tituloMes(ym) { return MESES[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4); }
function mesMas(ym, n) { var d = new Date(+ym.slice(0, 4), +ym.slice(5) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function mesActual() {
  var o = {};
  new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Bogota', year: 'numeric', month: '2-digit' }).formatToParts(new Date()).forEach(function (x) { o[x.type] = x.value; });
  return o.year + '-' + o.month;
}
function toast(t) { var el = $('#toast'); el.textContent = t; el.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = ''; }, 3000); }
function guardarTok(t) { memTok = t; try { window.localStorage.setItem('af_an_tok', t || ''); } catch (e) {} }
function leerTok() { try { var t = window.localStorage.getItem('af_an_tok'); if (t) { return t; } } catch (e) {} return memTok; }

function api(fn, args) {
  return new Promise(function (resolve, reject) {
    var a = args || [];
    function fin(r) {
      if (r && r.ok) { resolve(r.val); return; }
      var e = new Error((r && r.err) || 'Error desconocido');
      e.sesion = !!(r && r.sesion === false);
      reject(e);
    }
    if (window.CAJA_API) {
      fetch(window.CAJA_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, token: S.token, args: a }) })
        .then(function (r) { return r.json(); }).then(fin)
        .catch(function () { reject(new Error('No hay conexión con el servidor.')); });
    } else if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(fin).withFailureHandler(function (e) { reject(new Error((e && e.message) || 'Error de conexión.')); }).dispatch(fn, S.token, a);
    } else {
      reject(new Error('No hay conexión con el servidor.'));
    }
  });
}

function pintar(h) { $('#app').innerHTML = h; }

function pintarCargando(txt) {
  $('#sub').textContent = 'Calculando...';
  pintar('<div class="center"><div class="card"><p style="margin:0;font:700 18px var(--head)">' + esc(txt || 'Cargando los datos...') + '</p><p class="muted" style="margin:8px 0 0">Estoy leyendo la hoja de la caja y haciendo las cuentas. La primera vez puede tardar unos segundos; después responde rápido.</p><div class="bar"><i style="width:60%"></i></div></div></div>');
}

function manejarError(e) {
  S.cargando = false;
  if (e && e.sesion) { S.token = null; guardarTok(''); pantallaLogin('Tu sesión venció. Entra de nuevo.'); return; }
  toast((e && e.message) || 'Algo salió mal.');
  if (S.res) { S.ym = S.res.ym; pintarPanel(); return; }
  if (!S.res) { pintar('<div class="center"><div class="card red"><h2>No pude cargar los datos</h2><p>' + esc((e && e.message) || '') + '</p><button class="btn pri block" data-act="reintentar">Reintentar</button></div></div>'); }
}

function iniciar() {
  S.token = leerTok();
  S.ym = mesActual();
  api('estado', []).then(function (est) {
    if (!est.tieneClave) { pantallaCrear(); }
    else if (S.token) { cargar(false); }
    else { pantallaLogin(''); }
  }).catch(function (e) { pintar('<div class="center"><div class="card red"><h2>No pude conectar</h2><p>' + esc(e.message) + '</p><button class="btn pri block" data-act="reintentar">Reintentar</button></div></div>'); });
}

function pantallaLogin(msg) {
  $('#sub').textContent = 'Entrar'; $('#bSalir').style.display = 'none';
  pintar('<div class="center"><div class="card"><h2 style="margin-top:0">Entrar</h2>' + (msg ? '<p class="muted">' + esc(msg) + '</p>' : '') + '<label>Tu clave</label><input id="lc" type="password" autocomplete="current-password"><div style="height:12px"></div><button class="btn pri block" data-act="entrar">Entrar</button></div></div>');
}

function pantallaCrear() {
  $('#sub').textContent = 'Crear clave'; $('#bSalir').style.display = 'none';
  pintar('<div class="center"><div class="card"><h2 style="margin-top:0">Crea tu clave</h2><p class="muted">Esta página muestra dinero del negocio y se protege con una clave solo tuya. Mínimo 6 caracteres. Guárdala en un lugar seguro.</p><label>Clave nueva</label><input id="c1" type="password" autocomplete="new-password"><label>Repite la clave</label><input id="c2" type="password" autocomplete="new-password"><div style="height:12px"></div><button class="btn pri block" data-act="crear">Crear clave y entrar</button></div></div>');
}

function cargar(forzar) {
  S.cargando = true;
  if (forzar && S.res) { $('#sub').textContent = 'Actualizando...'; } else { pintarCargando(S.res ? 'Cargando ' + tituloMes(S.ym) + '...' : 'Entrando...'); }
  return api('resumen', [S.ym, !!forzar]).then(function (r) {
    S.res = r; S.cargando = false; pintarPanel();
    if (forzar && r.desdeCache) { toast('Los datos ya estaban recientes. Se actualizan solos cada 2 minutos.'); }
  }).catch(manejarError);
}

function hace(ts) {
  var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 60) { return 'hace ' + s + ' s'; }
  return 'hace ' + Math.round(s / 60) + ' min';
}

function graficoDias(r) {
  var n = r.diasMes, W = 700, H = 190, pl = 6, pb = 22, pt = 14, bw = (W - pl * 2) / n;
  var por = {};
  r.dias.forEach(function (d) { por[+d.fecha.slice(8)] = d.ventas; });
  var peDia = r.pe.ventasEquilibrio ? r.pe.ventasEquilibrio / n : 0, metaDia = r.meta > 0 ? r.meta / n : 0, mx = Math.max(peDia, metaDia, 1);
  for (var k in por) { if (por[k] > mx) { mx = por[k]; } }
  var sc = (H - pb - pt) / (mx * 1.08);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Ventas de cada día del mes frente al punto de equilibrio diario">';
  for (var i = 1; i <= n; i++) {
    var v = por[i] || 0, h = v * sc, x = pl + (i - 1) * bw + 2;
    var col = v <= 0 ? '#EADFD3' : (peDia > 0 && v >= peDia ? '#1F7A3A' : '#E0A020');
    s += '<rect x="' + x.toFixed(1) + '" y="' + (H - pb - Math.max(h, 2)).toFixed(1) + '" width="' + Math.max(2, bw - 4).toFixed(1) + '" height="' + Math.max(h, 2).toFixed(1) + '" rx="3" fill="' + col + '"></rect>';
    s += '<text x="' + (x + (bw - 4) / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="9" fill="#7A6A64">' + i + '</text>';
  }
  if (peDia > 0) {
    var y = H - pb - peDia * sc;
    s += '<line x1="0" x2="' + W + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '" stroke="#C8202B" stroke-width="1.5" stroke-dasharray="6 4"></line><text x="' + (W - 4) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#C8202B" font-weight="700">equilibrio diario ' + fmt(peDia) + '</text>';
  }
  if (metaDia > 0) {
    var y2 = H - pb - metaDia * sc;
    s += '<line x1="0" x2="' + W + '" y1="' + y2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#8A5A00" stroke-width="1.5" stroke-dasharray="2 4"></line><text x="4" y="' + (y2 - 4).toFixed(1) + '" font-size="10" fill="#8A5A00" font-weight="700">meta diaria ' + fmt(metaDia) + '</text>';
  }
  return s + '</svg>';
}

var MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
function fcorta(f) { return +f.slice(8) + ' ' + MES3[+f.slice(5, 7) - 1]; }

function cambioHtml(a, b, subeEsBueno) {
  if (!(Math.abs(b) > 0.5)) { return '<span class="muted">-</span>'; }
  var p = (a - b) / Math.abs(b);
  if (Math.abs(p) < 0.005) { return '<span class="muted">igual</span>'; }
  var sube = p > 0, bueno = sube === subeEsBueno;
  return '<span class="' + (bueno ? 'pos' : 'neg') + '"><b>' + (sube ? '▲ ' : '▼ ') + Math.abs(Math.round(p * 100)) + '%</b></span>';
}

function seccionComparacion(r) {
  var t = r.tot, pv = r.prev, h = '<h2>Comparación con el mes anterior</h2>';
  if (!pv.nDias && r.historico && r.historico.prevDias > 0) {
    var ha = t.ventas, hb = r.historico.prevVentasHasta;
    return h + '<div class="card tw"><table><thead><tr><th></th><th>' + esc(MESES[+r.ym.slice(5) - 1]) + ' (hasta el día ' + pv.hastaDia + ')</th><th>' + esc(MESES[+pv.ym.slice(5) - 1]) + ' (hasta el día ' + pv.hastaDia + ')</th><th>Cambio</th></tr></thead><tbody><tr><td>Ventas</td><td>' + fmt(ha) + '</td><td>' + fmt(hb) + '</td><td>' + (hb > 0 ? cambioHtml(ha, hb, true) : '-') + '</td></tr></tbody></table><p class="muted" style="margin:8px 0 0">' + esc(tituloMes(pv.ym)) + ' viene del histórico que cargaste del Excel, así que solo se pueden comparar las ventas (no los gastos, las compras ni los pedidos).</p></div>';
  }
  if (!pv.nDias) { return h + '<div class="card"><p class="muted" style="margin:0">No hay días registrados en ' + esc(tituloMes(pv.ym)) + ' para comparar.</p></div>'; }
  var a = t, b = pv.totHasta, c = pv.tot;
  var tkA = a.pedidos > 0 ? a.ventas / a.pedidos : 0, tkB = b.pedidos > 0 ? b.ventas / b.pedidos : 0, tkC = c.pedidos > 0 ? c.ventas / c.pedidos : 0;
  var filas = [['Ventas', a.ventas, b.ventas, c.ventas, true], ['Pedidos', a.pedidos, b.pedidos, c.pedidos, true, true], ['Ticket promedio', tkA, tkB, tkC, true], ['Gastos', a.gastos, b.gastos, c.gastos, false], ['Compras de insumos', a.compras, b.compras, c.compras, false], ['Trabajadores', a.trabajadores, b.trabajadores, c.trabajadores, false], ['Balance', a.balance, b.balance, c.balance, true]];
  h += '<div class="card tw"><table><thead><tr><th></th><th>' + esc(MESES[+r.ym.slice(5) - 1]) + ' (hasta el día ' + pv.hastaDia + ')</th><th>' + esc(MESES[+pv.ym.slice(5) - 1]) + ' (hasta el día ' + pv.hastaDia + ')</th><th>Cambio</th><th>' + esc(MESES[+pv.ym.slice(5) - 1]) + ' completo</th></tr></thead><tbody>';
  filas.forEach(function (f) { var m = f[5] ? function (x) { return String(Math.round(x)); } : fmt; h += '<tr><td>' + f[0] + '</td><td>' + m(f[1]) + '</td><td>' + m(f[2]) + '</td><td>' + cambioHtml(f[1], f[2], f[4]) + '</td><td>' + m(f[3]) + '</td></tr>'; });
  return h + '</tbody></table><p class="muted" style="margin:8px 0 0">Se comparan los mismos días de cada mes para que sea justo. Ventas más altas y gastos más bajos salen en verde.</p></div>';
}

function seccionSemanas(r) {
  var h = '<h2>Semana por semana</h2>', L = r.semanas.slice().reverse();
  if (!L.length) { return h + '<div class="card"><p class="muted" style="margin:0">Aún no hay semanas con datos.</p></div>'; }
  var asc = r.semanas;
  h += '<div class="card tw"><table><thead><tr><th>Semana</th><th>Días</th><th>Ventas</th><th>Cambio</th><th>Gastos</th><th>Compras</th><th>Trabajadores</th><th>Balance</th></tr></thead><tbody>';
  L.forEach(function (w) {
    var k = asc.indexOf(w), ant = k > 0 ? asc[k - 1] : null, enCurso = w.fin >= r.hoy && w.inicio <= r.hoy;
    h += '<tr><td>' + fcorta(w.inicio) + ' – ' + fcorta(w.fin) + (enCurso ? ' <span class="pill gold">en curso</span>' : '') + '</td><td>' + w.dias + '</td><td>' + fmt(w.ventas) + '</td><td>' + (ant && ant.dias >= 7 && w.dias >= 7 ? cambioHtml(w.ventas, ant.ventas, true) : '<span class="muted">-</span>') + '</td><td>' + fmt(w.gastos) + '</td><td>' + fmt(w.compras) + '</td><td>' + fmt(w.trabajadores) + '</td><td class="' + (w.balance >= 0 ? 'pos' : 'neg') + '">' + fmt(w.balance) + '</td></tr>';
  });
  return h + '</tbody></table><p class="muted" style="margin:8px 0 0">Las semanas van de lunes a domingo. El cambio solo se calcula entre semanas completas.</p></div>';
}

function seccionGastos(r) {
  var h = '<h2>Gastos por categoría</h2><div class="card">', t = r.tot, G = r.gastosCat;
  if (!G.length) { return h + '<p class="muted" style="margin:0">No hay gastos registrados en este mes.</p></div>'; }
  var mx = G[0].valor || 1;
  G.forEach(function (g) {
    h += '<div class="medio"><div class="n" style="width:150px">' + esc(g.cat) + '</div><div class="b"><i style="width:' + (g.valor / mx * 100).toFixed(0) + '%;background:' + (g.fijo ? '#C8202B' : '#E0A020') + '"></i></div><div class="m" style="width:170px">' + fmt(g.valor) + ' · ' + pct(t.ventas > 0 ? g.valor / t.ventas : 0) + '</div></div>';
  });
  h += '<div class="row" style="margin-top:10px"><span class="pill bad">Fijos registrados en la caja ' + fmt(r.pe.gastosFijosCaja) + ' (' + pct(t.ventas > 0 ? r.pe.gastosFijosCaja / t.ventas : 0) + ' de las ventas)</span><span class="pill gold">Variables ' + fmt(r.pe.gastosVariables) + ' (' + pct(t.ventas > 0 ? r.pe.gastosVariables / t.ventas : 0) + ')</span></div>';
  return h + '<p class="muted" style="margin:8px 0 0">Rojo: gasto fijo. Dorado: gasto variable. La caja decide qué categorías son fijas en su lista de gastos fijos (Ajustes de la caja). Los turnos y extras de los trabajadores se cuentan aparte como costo fijo.</p></div>';
}

function seccionDeudas(r) {
  var D = r.deudas, h = '<h2>Deudas pendientes</h2><div class="card ' + (D.n ? 'gold' : 'ok') + '">';
  if (!D.n) { return h + '<p style="margin:0">No hay deudas por cobrar ✓</p></div>'; }
  h += '<p style="margin:0 0 8px"><b>' + fmt(D.total) + '</b> por cobrar en ' + D.n + (D.n === 1 ? ' pedido' : ' pedidos') + ' (de todos los días, no solo de este mes).</p><div class="tw"><table><thead><tr><th>Cliente</th><th>Día</th><th>Pedido</th><th>Falta</th></tr></thead><tbody>';
  D.lista.forEach(function (x) { h += '<tr><td>' + esc(x.cliente) + '</td><td>' + fcorta(x.fecha) + '</td><td>' + esc(x.num) + '</td><td>' + fmt(x.valor) + '</td></tr>'; });
  h += '</tbody></table></div>';
  if (D.n > D.lista.length) { h += '<p class="muted" style="margin:8px 0 0">Se muestran las ' + D.lista.length + ' más recientes.</p>'; }
  return h + '</div>';
}

function pl(n, uno, varios) { return n + ' ' + (n === 1 ? uno : varios); }

function colorMargen(p) { return p >= 0.5 ? 'pos' : (p >= 0.3 ? '' : 'neg'); }

function seccionUtilidad(r) {
  var R = r.recetas, t = r.tot, h = '<h2>¿Quedó ganancia?</h2>';
  if (!(R.cogs > 0)) {
    return h + '<div class="card gold"><p style="margin:0">Todavía no puedo calcular el costo de lo vendido: faltan precios de compra de los insumos con su cantidad base (en la caja, registra las compras de insumos con su cantidad y costo). Mientras tanto, el punto de equilibrio usa las compras del mes.</p></div>';
  }
  h += '<div class="card ' + (R.utilidad >= 0 ? 'ok' : 'red') + '"><div class="grid g3"><div><div class="muted">Ventas</div><div style="font:700 22px var(--head)">' + fmt(t.ventas) + '</div></div><div><div class="muted">(−) Costo de lo vendido (según recetas)</div><div style="font:700 22px var(--head)">' + fmt(R.cogs) + '</div><div class="muted">' + pct(t.ventas > 0 ? R.cogs / t.ventas : 0) + ' de las ventas</div></div><div><div class="muted">= Utilidad bruta</div><div style="font:700 22px var(--head)">' + fmt(R.utilidadBruta) + '</div><div class="muted">' + pct(t.ventas > 0 ? R.utilidadBruta / t.ventas : 0) + ' de las ventas</div></div></div>';
  var FC = r.fijosCosteo;
  if (FC && FC.ok) {
    var gVar = t.gastos - r.pe.gastosFijosCaja;
    h += '<div class="grid g3" style="margin-top:12px"><div><div class="muted">(−) Otros gastos (de la caja)</div><div style="font:700 20px var(--head)">' + fmt(gVar) + '</div></div><div><div class="muted">(−) Gastos fijos (del costeo)</div><div style="font:700 20px var(--head)">' + fmt(FC.cargado) + '</div>' + (FC.factor < 1 ? '<div class="muted">' + (FC.factor > 0 ? 'la parte del mes que va corrida (' + pct(FC.factor) + ' de ' + fmt(FC.total) + ')' : 'este mes aún no empieza') + '</div>' : '') + '</div><div><div class="muted">(−) Turnos y extras de trabajadores</div><div style="font:700 20px var(--head)">' + fmt(t.base + t.extras) + '</div></div></div><div style="margin-top:12px"><div class="muted">= Utilidad del mes</div><div class="' + (R.utilidad >= 0 ? 'pos' : 'neg') + '" style="font:700 26px var(--head)">' + fmt(R.utilidad) + '</div></div>';
  } else {
  h += '<div class="grid g3" style="margin-top:12px"><div><div class="muted">(−) Gastos</div><div style="font:700 20px var(--head)">' + fmt(t.gastos) + '</div></div><div><div class="muted">(−) Turnos y extras de trabajadores</div><div style="font:700 20px var(--head)">' + fmt(t.base + t.extras) + '</div></div><div><div class="muted">= Utilidad del mes</div><div class="' + (R.utilidad >= 0 ? 'pos' : 'neg') + '" style="font:700 24px var(--head)">' + fmt(R.utilidad) + '</div></div></div>';
  }
  h += '<p class="muted" style="margin:10px 0 0">El costo de lo vendido sale de la receta de cada producto (con lo que se quitó o agregó en cada pedido) y del precio promedio de compra de cada insumo en los últimos 90 días. Los domicilios no entran porque se pagan completos a quien los lleva.</p></div>';
  if (R.faltanPrecio.length) { h += '<div class="card gold"><b>Faltan precios de compra</b><p class="muted" style="margin:4px 0 0">Estos insumos se usaron pero no tienen compras registradas con cantidad y costo, así que el costo real puede ser mayor: ' + esc(R.faltanPrecio.join(', ')) + '. Escribe un precio de referencia en la sección <b>Precios de referencia de los insumos</b>, más abajo.</p></div>'; }
  return h;
}

function seccionProductosVendidos(r) {
  var V = r.recetas.vendidos, h = '<h2>Qué dejó cada producto este mes</h2>';
  if (!V.length || !(r.recetas.cogs > 0)) { return h + '<div class="card"><p class="muted" style="margin:0">Cuando haya ventas con costo de receta aparece aquí cuánto dejó cada producto.</p></div>'; }
  var totM = V.reduce(function (a, x) { return a + Math.max(0, x.margen); }, 0) || 1;
  h += '<div class="card tw"><table><thead><tr><th>Producto</th><th>Unidades</th><th>Ventas</th><th>Costo</th><th>Deja</th><th>Margen</th><th>% de lo que deja el negocio</th></tr></thead><tbody>';
  V.forEach(function (x) { h += '<tr><td>' + esc(x.name) + '</td><td>' + Math.round(x.uds) + '</td><td>' + fmt(x.ventas) + '</td><td>' + fmt(x.costo) + '</td><td class="' + (x.margen >= 0 ? 'pos' : 'neg') + '"><b>' + fmt(x.margen) + '</b></td><td class="' + colorMargen(x.margenPct) + '">' + pct(x.margenPct) + '</td><td>' + pct(Math.max(0, x.margen) / totM) + '</td></tr>'; });
  h += '</tbody></table><p class="muted" style="margin:8px 0 0">Ordenados del que más deja al que menos. Las ventas son a precio cobrado, antes de descuentos del pedido completo.</p></div>';
  var peor = V.filter(function (x) { return x.ventas > 0; }).sort(function (a, b) { return a.margenPct - b.margenPct; }).slice(0, 3);
  if (peor.length) { h += '<div class="card"><h3>Los de menor margen</h3><p style="margin:0">' + peor.map(function (x) { return esc(x.name) + ' (' + pct(x.margenPct) + ')'; }).join(' · ') + '</p></div>'; }
  return h;
}

function seccionCostoCatalogo(r) {
  var P = r.recetas.productos, h = '<h2>Costo de cada producto según su receta</h2>';
  if (!P.length) { return h + '<div class="card"><p class="muted" style="margin:0">No encontré productos con receta en la hoja.</p></div>'; }
  h += '<div class="card tw"><table><thead><tr><th>Producto</th><th>Precio</th><th>Costo de la receta</th><th>Deja</th><th>Margen</th></tr></thead><tbody>';
  P.forEach(function (x) {
    var nota = x.sinReceta ? ' <span class="pill gold">sin receta</span>' : (x.faltan ? ' <span class="pill bad">falta precio de ' + x.faltan + '</span>' : '');
    if (x.sinReceta) { h += '<tr><td>' + esc(x.name) + nota + '</td><td>' + fmt(x.precio) + '</td><td class="muted">-</td><td class="muted">-</td><td class="muted">-</td></tr>'; return; }
    h += '<tr><td>' + esc(x.name) + nota + '</td><td>' + fmt(x.precio) + '</td><td>' + fmt(x.costo) + '</td><td class="' + (x.margen >= 0 ? 'pos' : 'neg') + '">' + fmt(x.margen) + '</td><td class="' + colorMargen(x.margenPct) + '">' + pct(x.margenPct) + '</td></tr>';
  });
  return h + '</tbody></table><p class="muted" style="margin:8px 0 0">Receta estándar de cada producto, con empaques, al precio promedio de compra de los últimos 90 días. Los combos suman las recetas de lo que incluyen. Si un producto dice “sin receta”, su costo sale de la opción que se escoge al vender (por ejemplo, el sabor de una gaseosa) y no del catálogo.</p></div>';
}

function seccionRegalado(r) {
  var R = r.recetas, D = R.descuentos, h = '<h2>Descuentos, cortesías, comida de empleados y pérdidas</h2><div class="grid g2">';
  var tipos = Object.keys(D.tipos).map(function (k) { return esc(k) + ' ' + fmt(D.tipos[k]); }).join(' · ');
  h += '<div class="kpi"><div class="l">Descuentos dados</div><div class="v">' + fmt(D.v) + '</div><div class="s">' + pct(r.tot.ventas > 0 ? D.v / (r.tot.ventas + D.v) : 0) + ' de lo que se habría vendido' + (tipos ? ' · ' + tipos : '') + '</div></div>';
  h += '<div class="kpi"><div class="l">Comida de empleados</div><div class="v">' + fmt(R.empleados.costo) + '</div><div class="s">costo de insumos · ' + R.empleados.n + ' ' + (R.empleados.n === 1 ? 'pedido' : 'pedidos') + ' (a precio de lista ' + fmt(R.empleados.v) + ')</div></div>';
  h += '<div class="kpi"><div class="l">Cortesías</div><div class="v">' + fmt(R.cortesias.costo) + '</div><div class="s">costo de insumos · ' + R.cortesias.n + ' ' + (R.cortesias.n === 1 ? 'pedido' : 'pedidos') + ' (a precio de lista ' + fmt(R.cortesias.v) + ')</div></div>';
  h += '<div class="kpi"><div class="l">Pérdidas</div><div class="v ' + (R.perdidas.n ? 'neg' : '') + '">' + fmt(R.perdidas.costo) + '</div><div class="s">costo de insumos · ' + R.perdidas.n + ' ' + (R.perdidas.n === 1 ? 'pedido que no se cobró' : 'pedidos que no se cobraron') + ' (a precio de lista ' + fmt(R.perdidas.v) + ')</div></div>';
  h += '</div>';
  var C = R.canceladas, nombres = { descartada: 'descartados', espera: 'en espera', revendida: 'revendidos' }, partes = Object.keys(C).map(function (k) { return C[k].n + ' ' + (nombres[k] || k) + ' (' + fmt(C[k].v) + ')'; });
  h += '<div class="card" style="margin-top:12px"><h3>Pedidos que no cuentan como venta</h3><p style="margin:0">' + (partes.length ? partes.join(' · ') : 'No hay pedidos cancelados este mes.') + '</p><p class="muted" style="margin:8px 0 0">Los descuentos ya están restados de las ventas. La comida de empleados, las cortesías y las pérdidas no suman a las ventas; aquí se ve cuánto costaron en insumos.</p></div>';
  return h;
}

function fq(x, unit) {
  x = Number(x) || 0;
  if (unit === 'g' && Math.abs(x) >= 1000) { return (x / 1000).toFixed(2).replace('.', ',') + ' kg'; }
  if (unit === 'ml' && Math.abs(x) >= 1000) { return (x / 1000).toFixed(2).replace('.', ',') + ' L'; }
  var r = Math.round(x * 10) / 10;
  return String(r).replace('.', ',') + ' ' + (unit === 'unidad' ? 'und' : (unit || ''));
}

function seccionCompras(r) {
  var C = r.compras, h = '<h2>Compras y precios de proveedores</h2>';
  if (!C.n) { return h + '<div class="card"><p class="muted" style="margin:0">No hay compras registradas en este mes.</p></div>'; }
  h += '<div class="grid g3"><div class="kpi"><div class="l">Comprado en el mes</div><div class="v">' + fmt(C.total) + '</div><div class="s">' + C.n + ' compras' + (C.inversion > 0 ? ' · inversión aparte ' + fmt(C.inversion) : '') + '</div></div>';
  h += '<div class="kpi"><div class="l">Proveedores</div><div class="v">' + C.porProveedor.length + '</div><div class="s">' + (C.porProveedor[0] ? 'el mayor: ' + esc(C.porProveedor[0].prov) + ' (' + fmt(C.porProveedor[0].costo) + ')' : '') + '</div></div>';
  var sube = C.cambios.filter(function (x) { return x.cambio > 0.005; }).length, baja = C.cambios.filter(function (x) { return x.cambio < -0.005; }).length;
  h += '<div class="kpi"><div class="l">Precios de insumos</div><div class="v">' + (sube ? '<span class="neg">▲ ' + sube + '</span>' : '-') + ' ' + (baja ? '<span class="pos">▼ ' + baja + '</span>' : '') + '</div><div class="s">subieron / bajaron frente a los 90 días anteriores</div></div></div>';
  var mx = C.porInsumo.length ? C.porInsumo[0].costo || 1 : 1;

  h += '</div>';
  h += '<div class="card"><h3>Por proveedor</h3><div class="tw"><table><thead><tr><th>Proveedor</th><th>Compras</th><th>Total</th><th>% del total</th></tr></thead><tbody>';
  C.porProveedor.forEach(function (x) { h += '<tr><td>' + esc(x.prov) + '</td><td>' + x.n + '</td><td>' + fmt(x.costo) + '</td><td>' + pct((C.total + C.inversion) > 0 ? x.costo / (C.total + C.inversion) : 0) + '</td></tr>'; });
  h += '</tbody></table></div></div>';
  h += '<div class="card"><h3>Cómo cambian los precios de compra</h3>';

  h += '<div class="tw"><table><thead><tr><th>Insumo</th><th>Este mes</th><th>Antes (90 días)</th><th>Cambio</th><th>Última compra</th></tr></thead><tbody>';
  C.cambios.forEach(function (x) { h += '<tr><td>' + esc(x.name) + '</td><td>' + fmt(x.precio) + ' por ' + esc(x.precioUnidad) + '</td><td>' + fmt(x.antes) + '</td><td>' + cambioHtml(x.precio, x.antes, false) + '</td><td>' + (x.ultimo === null ? '-' : fmt(x.ultimo)) + '</td></tr>'; });
  return h + '</tbody></table></div><p class="muted" style="margin:8px 0 0">Precio promedio pagado este mes frente al de los 90 días anteriores. Si el precio sube, sale en rojo. Sube el costo de las recetas, y tal vez toque revisar el precio de venta.</p></div>';
}

function htmlInventario() {
  var V = S.inv;
  if (!V) { return '<div class="card"><p class="muted" style="margin:0">Calculando el inventario...</p></div>'; }
  var porId = {}; V.items.forEach(function (x) { porId[x.id] = x; });
  var bajo = V.bajoMinimo.map(function (id) { return porId[id]; }).filter(Boolean), neg = V.negativos.map(function (id) { return porId[id]; }).filter(Boolean);
  var h = '<div class="grid g3"><div class="kpi"><div class="l">Valor del inventario</div><div class="v">' + fmt(V.valor) + '</div><div class="s">hay × precio de compra' + (V.sinPrecio ? ' · ' + V.sinPrecio + ' sin precio' : '') + '</div></div>';
  h += '<div class="kpi"><div class="l">Por comprar (bajo el mínimo)</div><div class="v ' + (bajo.length ? 'neg' : 'pos') + '">' + bajo.length + '</div><div class="s">de ' + V.items.length + ' insumos activos</div></div>';
  h += '<div class="kpi"><div class="l">Con stock negativo</div><div class="v ' + (neg.length ? 'neg' : 'pos') + '">' + neg.length + '</div><div class="s">faltan compras o conteos por registrar</div></div></div>';
  if (bajo.length) {
    h += '<div class="card gold" style="margin-top:12px"><h3>Por comprar</h3><div class="tw"><table><thead><tr><th>Insumo</th><th>Hay</th><th>Mínimo</th><th>Precio</th></tr></thead><tbody>';
    bajo.forEach(function (x) { h += '<tr><td>' + esc(x.name) + '</td><td class="' + (x.hay < 0 ? 'neg' : '') + '"><b>' + fq(x.hay, x.unit) + '</b></td><td>' + fq(x.min, x.unit) + '</td><td>' + (x.precio === null ? '-' : fmt(x.precio) + ' por ' + esc(x.precioUnidad)) + '</td></tr>'; });
    h += '</tbody></table></div></div>';
  }
  if (neg.length) { h += '<div class="card red"><b>Stock negativo</b><p class="muted" style="margin:4px 0 0">' + neg.map(function (x) { return esc(x.name) + ' (' + fq(x.hay, x.unit) + ')'; }).join(' · ') + '. Suele pasar cuando no se registró una compra o un conteo. Haz el conteo en la caja para corregirlo.</p></div>'; }
  var L = V.items.slice().sort(function (a, b) { return b.valor - a.valor; });
  h += '<details class="card"><summary>Ver todo el inventario (' + V.items.length + ' insumos)</summary><div class="tw" style="margin-top:8px"><table><thead><tr><th>Insumo</th><th>Hay</th><th>Mínimo</th><th>Usado en ventas</th><th>Precio</th><th>Valor</th></tr></thead><tbody>';
  L.forEach(function (x) { h += '<tr><td>' + esc(x.name) + '</td><td class="' + (x.hay < 0 ? 'neg' : '') + '">' + fq(x.hay, x.unit) + '</td><td>' + (x.min > 0 ? fq(x.min, x.unit) : '-') + '</td><td>' + fq(x.usado, x.unit) + '</td><td>' + (x.precio === null ? '-' : fmt(x.precio) + ' por ' + esc(x.precioUnidad)) + '</td><td>' + fmt(x.valor) + '</td></tr>'; });
  h += '<tr class="tot"><td>Total</td><td></td><td></td><td></td><td></td><td>' + fmt(V.valor) + '</td></tr></tbody></table></div></details>';
  return h + '<p class="muted">Calculado como la caja: lo que había + lo comprado − lo usado en ventas ± conteos, con los datos de la hoja hasta el ' + esc(V.hasta ? fcorta(V.hasta) : '-') + '. Es el estado de hoy, aunque estés viendo un mes anterior.</p>';
}

function seccionInventario() { return '<h2>Inventario</h2><div id="invBox">' + htmlInventario() + '</div>'; }

function cargarInventario(forzar) {

function seccionMermas(r) {

  if (!M.conteos && !M.excluidosMil) { return h + '<div class="card"><p class="muted" style="margin:0">Este mes no hay conteos de inventario registrados en la caja.</p></div>'; }
  h += '<div class="grid g3"><div class="kpi"><div class="l">Faltante (se perdió)</div><div class="v ' + (M.faltante < 0 ? 'neg' : '') + '">' + fmt(M.faltante) + '</div><div class="s">valor de lo que faltaba al contar</div></div>';
  h += '<div class="kpi"><div class="l">Sobrante</div><div class="v">' + fmt(M.sobrante) + '</div><div class="s">había más de lo que decía el sistema</div></div>';
  h += '<div class="kpi"><div class="l">Conteos</div><div class="v">' + M.conteos + '</div><div class="s">' + (r.tot.ventas > 0 && M.faltante < 0 ? 'el faltante es el ' + pct1(-M.faltante / r.tot.ventas) + ' de las ventas' : 'del mes') + '</div></div></div>';
  if (M.excluidosMil) { h += '<div class="card gold" style="margin-top:12px"><b>' + M.excluidosMil + (M.excluidosMil === 1 ? ' conteo tiene' : ' conteos tienen') + ' el error del punto (×1000)</b><p class="muted" style="margin:4px 0 0">Los dejé por fuera para no inflar las mermas. En la caja aparece un aviso para arreglarlos.</p></div>'; }
  if (M.items.length) {
    h += '<div class="card" style="margin-top:12px"><div class="tw"><table><thead><tr><th>Insumo</th><th>Conteos</th><th>Diferencia</th><th>Valor</th></tr></thead><tbody>';
    M.items.forEach(function (x) { h += '<tr><td>' + esc(x.name) + '</td><td>' + x.n + '</td><td class="' + (x.dif < 0 ? 'neg' : 'pos') + '">' + (x.dif > 0 ? '+' : '') + fq(x.dif, x.unit) + '</td><td class="' + (x.valor < 0 ? 'neg' : 'pos') + '">' + fmt(x.valor) + '</td></tr>'; });
    h += '</tbody></table></div><p class="muted" style="margin:8px 0 0">Diferencia = lo contado menos lo que decía el sistema. Negativo: faltó producto (desperdicio, porciones más grandes, errores de registro).' + (M.sinPrecio ? ' ' + M.sinPrecio + ' insumos no tienen precio de compra, así que su valor sale en cero.' : '') + '</p></div>';
  }
  return h;
}

function personasMes(r) {
  var P = {}, orden = [];
  r.dias.forEach(function (d) {
    (d.turnos || []).forEach(function (t) {
      var nombre = t.n || (t.c + ' (sin nombre)'), o = P[nombre];
      if (!o) { o = P[nombre] = { nombre: nombre, cargos: {}, turnos: 0, base: 0, dom: 0, extras: 0, total: 0, dias: [] }; orden.push(nombre); }
      o.turnos++; o.base += t.b; o.dom += t.d; o.extras += t.e; o.total += t.t; o.cargos[t.c] = 1; o.dias.push(d.fecha);
    });
  });
  return orden.map(function (n) { return P[n]; }).sort(function (a, b) { return b.turnos - a.turnos; });
}

function seccionFijosCosteo(r) {
  var F = r.fijosCosteo, h = '<h2>Gastos fijos del mes (del costeo)</h2>';
  if (!F || !F.configurado) {

  }
  if (!F.ok) { return h + '<div class="card gold"><b>No pude leer el costeo</b><p class="muted" style="margin:4px 0 0">' + esc(F.error || '') + ' Mientras tanto uso los gastos fijos que se registran en la caja.</p></div>'; }
  var f = F.total > 0 ? F.pagado / F.total : 0;

  h += '<div class="card" style="margin-top:12px"><div class="bar"><i style="width:' + Math.min(100, f * 100).toFixed(0) + '%"></i></div><div class="tw"><table><thead><tr><th>Gasto</th><th>Debes</th><th>Pagado</th><th>Falta</th><th>Estado</th></tr></thead><tbody>';
  F.items.forEach(function (x) {
    h += '<tr><td>' + esc(x.nombre) + (x.frecuencia === 'Semanal' ? ' <span class="muted">(semanal)</span>' : '') + '</td><td>' + fmt(x.due) + '</td><td>' + fmt(x.pagado) + '</td><td class="' + (x.pendiente > 0 ? 'neg' : 'pos') + '">' + (x.pendiente > 0 ? fmt(x.pendiente) : '-') + '</td><td><span class="' + (x.estado === 'Pagado' ? 'pos' : (x.estado === 'Parcial' ? '' : 'neg')) + '"><b>' + esc(x.estado) + '</b></span></td></tr>';
  });
  h += '<tr class="tot"><td>Total</td><td>' + fmt(F.total) + '</td><td>' + fmt(F.pagado) + '</td><td>' + fmt(F.pendiente) + '</td><td></td></tr></tbody></table></div>';
  h += '<p class="muted" style="margin:8px 0 0">Los gastos y los pagos se anotan en el costeo (Catálogo → Gastos fijos → Pagos del mes). Estos gastos entran al punto de equilibrio y a la utilidad en lugar de los gastos fijos que se registran en la caja, para no contarlos dos veces.' + (F.sinPagos ? ' <b>Aún no existe la pestaña de pagos en el costeo:</b> ejecuta la función instalar allá.' : '') + '</p></div>';
  return h;
}

function capi(x) { return x.charAt(0).toUpperCase() + x.slice(1); }

function htmlHistoria() {
  var Q = S.his;
  if (!Q) { return '<div class="card"><p class="muted" style="margin:0">Calculando las ventas del año...</p></div>'; }
  var h = '<div class="card no-print"><div class="row sp"><button class="btn sm" data-act="hisprev">◀</button><div style="font:700 18px var(--head)">Año ' + esc(Q.anio) + '</div><button class="btn sm" data-act="hisnext">▶</button></div></div>';
  if (!Q.configurado) { h += '<div class="card gold"><b>Falta conectar el costeo</b><p class="muted" style="margin:4px 0 0">Las ventas históricas se guardan en el costeo (Ajustes → Ventas históricas del año). Para verlas aquí, pega el ID del costeo en la línea 2 de Código.gs y ejecuta guardarIds. Mientras tanto se muestran solo las ventas de la caja.</p></div>'; }
  else if (!Q.costeoOk) { h += '<div class="card gold"><b>No pude leer el costeo</b><p class="muted" style="margin:4px 0 0">Mientras tanto se muestran solo las ventas de la caja.</p></div>'; }
  else if (Q.sinHistorico) { h += '<div class="card gold"><b>El costeo todavía no tiene la pestaña del histórico</b><p class="muted" style="margin:4px 0 0">Ejecuta la función instalar en el costeo y carga tus ventas en Ajustes → Ventas históricas del año.</p></div>'; }
  else if (!Q.hayHistorico) { h += '<div class="card gold"><b>Aún no has cargado ventas históricas</b><p class="muted" style="margin:4px 0 0">Cárgalas en el costeo: Ajustes → Ventas históricas del año.</p></div>'; }
  var T = Q.totales;
  if (!T.total) { return h + '<div class="card"><p class="muted" style="margin:0">No hay ventas registradas en ' + esc(Q.anio) + '.</p></div>'; }
  var mejor = Q.mejor ? capi(MESES[+Q.mejor.ym.slice(5) - 1]) : '-';
  h += '<div class="grid g3"><div class="kpi"><div class="l">Vendido en el año</div><div class="v">' + fmt(T.total) + '</div><div class="s">' + T.dias + ' días con ventas</div></div><div class="kpi"><div class="l">Mejor mes</div><div class="v">' + esc(mejor) + '</div><div class="s">' + (Q.mejor ? fmt(Q.mejor.total) : '') + '</div></div><div class="kpi"><div class="l">Promedio por día</div><div class="v">' + fmt(T.dias > 0 ? T.total / T.dias : 0) + '</div><div class="s">de los días con ventas</div></div></div>';
  var mx = 0;
  Q.meses.forEach(function (m) { if (m.total > mx) { mx = m.total; } });
  h += '<div class="card" style="margin-top:12px"><h3>Ventas por mes</h3>';
  Q.meses.forEach(function (m) {
    var wh = mx > 0 ? m.hist / mx * 100 : 0, wc = mx > 0 ? m.caja / mx * 100 : 0;
    h += '<div class="medio"><div class="n" style="width:84px">' + esc(MESES[+m.ym.slice(5) - 1].slice(0, 3)) + '</div><div class="b" style="display:flex"><i style="width:' + wh.toFixed(1) + '%;background:var(--gold)"></i><i style="width:' + wc.toFixed(1) + '%"></i></div><div class="m" style="width:120px">' + (m.total ? fmt(m.total) : '-') + '</div></div>';
  });
  h += '<div class="row" style="margin-top:8px"><span class="pill gold">Histórico (Excel)</span><span class="pill bad">Caja</span></div></div>';
  h += '<div class="card tw"><table><thead><tr><th>Mes</th><th>Histórico</th><th>Caja</th><th>Total</th><th>Días</th><th>Por día</th><th>vs mes anterior</th></tr></thead><tbody>';
  Q.meses.forEach(function (m, i) {
    if (!m.total) { return; }
    var ant = i > 0 ? Q.meses[i - 1].total : 0;
    h += '<tr><td>' + esc(capi(MESES[+m.ym.slice(5) - 1])) + '</td><td>' + (m.hist ? fmt(m.hist) : '-') + '</td><td>' + (m.caja ? fmt(m.caja) : '-') + '</td><td><b>' + fmt(m.total) + '</b></td><td>' + m.dias + '</td><td>' + fmt(m.promedio) + '</td><td>' + (ant > 0 ? cambioHtml(m.total, ant, true) : '-') + '</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td><td>' + fmt(T.hist) + '</td><td>' + fmt(T.caja) + '</td><td>' + fmt(T.total) + '</td><td>' + T.dias + '</td><td></td><td></td></tr></tbody></table>';
  h += '<p class="muted" style="margin:8px 0 0">Son solo ventas: del histórico no se conocen los gastos, las compras ni los costos, así que no entran en la utilidad ni en el inventario. ' + (Q.solapadas ? Q.solapadas + (Q.solapadas === 1 ? ' día del histórico coincide con un día de la caja' : ' días del histórico coinciden con días de la caja') + ' y se cuenta solo la caja, para no sumar dos veces. ' : '') + 'Si un mes tiene los dos, se suman los días de cada uno.</p></div>';
  return h;
}

function bannerHistorico(r) {

function seccionTurnos(r) {
  var L = personasMes(r), h = '<h2>Turnos por trabajador</h2>';
  if (!L.length) { return h + '<div class="card"><p class="muted" style="margin:0">No hay turnos registrados este mes.</p></div>'; }
  var tt = { turnos: 0, base: 0, dom: 0, extras: 0, total: 0 };
  h += '<div class="card tw"><table><thead><tr><th>Trabajador</th><th>Cargo</th><th>Turnos</th><th>Base</th><th>Domicilios</th><th>Extras</th><th>Total pagado</th><th>Por turno</th></tr></thead><tbody>';
  L.forEach(function (x) {
    ['turnos', 'base', 'dom', 'extras', 'total'].forEach(function (k) { tt[k] += x[k]; });
    h += '<tr><td>' + esc(x.nombre) + '</td><td>' + esc(Object.keys(x.cargos).join(', ')) + '</td><td><b>' + x.turnos + '</b></td><td>' + fmt(x.base) + '</td><td>' + fmt(x.dom) + '</td><td>' + fmt(x.extras) + '</td><td><b>' + fmt(x.total) + '</b></td><td>' + fmt(x.total / x.turnos) + '</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td><td></td><td>' + tt.turnos + '</td><td>' + fmt(tt.base) + '</td><td>' + fmt(tt.dom) + '</td><td>' + fmt(tt.extras) + '</td><td>' + fmt(tt.total) + '</td><td></td></tr></tbody></table>';
  h += '<p class="muted" style="margin:8px 0 0">Sale de los turnos que se marcan como trabajados en la caja, con el pago de cada día (turno, domicilios y extras).' + (L.some(function (x) { return /sin nombre/.test(x.nombre); }) ? ' <b>Algunos turnos no tienen nombre:</b> escribe en la caja el nombre de quien trabajó, o define abajo, en Nómina del año, quién ocupa cada cargo.' : '') + '</p>';
  h += '<details style="margin-top:8px"><summary>Ver día por día</summary><div class="tw"><table><thead><tr><th>Día</th>' + L.map(function (x) { return '<th>' + esc(x.nombre) + '</th>'; }).join('') + '</tr></thead><tbody>';
  r.dias.forEach(function (d) {
    h += '<tr><td>' + fcorta(d.fecha) + '</td>' + L.map(function (x) { var t = (d.turnos || []).filter(function (y) { return (y.n || (y.c + ' (sin nombre)')) === x.nombre; })[0]; return '<td>' + (t ? '<span class="pos">✓</span> ' + fmt(t.t) : '<span class="muted">-</span>') + '</td>'; }).join('') + '</tr>';
  });
  return h + '</tbody></table></div></details></div>';
}

function prestPersona(p, cfg, nMeses) {
  var tot = 0, s1 = 0, s2 = 0, turnos = 0, dom = 0, base = 0, extras = 0, i;
  for (i = 0; i < nMeses; i++) {
    var m = p.meses[i], sal = m.base + m.extras + (cfg.incluirDom ? m.dom : 0);
    tot += sal; if (i < 6) { s1 += sal; } else { s2 += sal; }
    turnos += m.turnos; dom += m.dom; base += m.base; extras += m.extras;
  }
  var ssPct = (cfg.exonera ? 0 : cfg.salud + cfg.sena + cfg.icbf) + cfg.pension + cfg.arl + cfg.caja;
  return { salario: tot, turnos: turnos, base: base, dom: dom, extras: extras, cesantias: tot * cfg.cesantias / 100, intereses: tot * cfg.intereses / 100, prima: tot * cfg.prima / 100, primaS1: s1 * cfg.prima / 100, primaS2: s2 * cfg.prima / 100, vacaciones: tot * cfg.vacaciones / 100, ss: tot * ssPct / 100 };
}

function mesesDelAnio(N) {
  var hoy = N.hoy || '', y = +N.anio;
  if (+hoy.slice(0, 4) === y) { return +hoy.slice(5, 7); }
  return +hoy.slice(0, 4) > y ? 12 : 0;
}

function htmlNomina() {
  var N = S.nom;
  if (!N) { return '<div class="card"><p class="muted" style="margin:0">Calculando la nómina del año...</p></div>'; }
  var cfg = N.cfg, nm = mesesDelAnio(N), h = '';

    h += '</tbody></table></div><p class="muted" style="margin:4px 0 0">Primer turno: ' + fcorta(p.primerDia) + ' · último: ' + fcorta(p.ultimoDia) + '</p>';
  });
  h += '</details>';
  var primaFecha = (nm < 6 ? '30 de junio' : '20 de diciembre');
  h += '<div class="card"><h3>Fechas de pago</h3><p style="margin:0">Prima: <b>30 de junio</b> y <b>20 de diciembre</b>. Intereses de las cesantías: <b>31 de enero</b>. Consignar cesantías: <b>14 de febrero</b> del año siguiente. Próxima prima: ' + primaFecha + '.</p></div>';
  var concep = [['Cesantías', T.cesantias], ['Intereses de cesantías', T.intereses], ['Prima', T.prima], ['Vacaciones', T.vacaciones], ['Seguridad social', T.ss]], aho = {};
  N.ahorros.forEach(function (a) { aho[a.c] = (aho[a.c] || 0) + a.v; });
  h += '<div class="card tw"><h3>Ahorro registrado frente a lo requerido</h3><table><thead><tr><th>Concepto</th><th>Debes tener</th><th>Llevas ahorrado</th><th>Falta</th></tr></thead><tbody>';
  concep.forEach(function (c) { var a = aho[c[0]] || 0, f = c[1] - a; h += '<tr><td>' + c[0] + '</td><td>' + fmt(c[1]) + '</td><td>' + fmt(a) + '</td><td class="' + (f > 0.5 ? 'neg' : 'pos') + '"><b>' + (f > 0.5 ? fmt(f) : 'al día') + '</b></td></tr>'; });
  h += '</tbody></table></div>';
  h += '<div class="card"><h3>Registrar un ahorro</h3><div class="grid g2"><div><label>Para qué es</label><select id="aConcepto">' + N.conceptos.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div><div><label>Valor ahorrado ($)</label><input id="aValor" type="text" inputmode="numeric" placeholder="Ej: 150.000"></div><div><label>Fecha</label><input id="aFecha" type="date" value="' + esc(N.hoy) + '"></div><div><label>De quién (opcional)</label><select id="aPersona"><option value="">Todos</option>' + N.personas.map(function (p) { return '<option>' + esc(p.nombre) + '</option>'; }).join('') + '</select></div></div><label>Nota (opcional)</label><input id="aNota" type="text" maxlength="120"><div style="height:10px"></div><button class="btn pri" data-act="agregarAhorro">Registrar ahorro</button>';

="display:flex;gap:8px;align-items:center"><input id="nDom" type="checkbox" style="width:auto;min-height:0"' + (cfg.incluirDom ? ' checked' : '') + '> Contar el bono de domicilios como parte del salario</label><div style="height:10px"></div><button class="btn" data-act="guardarNomCfg">Guardar</button></details>';

function seccionNomina() { return '<h2>Nómina del año y prestaciones</h2><div id="nomBox">' + htmlNomina() + '</div>'; }

function cargarNomina(forzar) {
  S.nomCargando = true;
  if (!S.nomAnio) { S.nomAnio = (S.res ? S.res.hoy : mesActual()).slice(0, 4); }
  api('nomina', [String(S.nomAnio), !!forzar]).then(function (v) {
    S.nom = v; S.nomCargando = false;
    var el = $('#nomBox'); if (el) { el.innerHTML = htmlNomina(); }
  }).catch(function (e) {
    S.nomCargando = false;
    var el = $('#nomBox'); if (el) { el.innerHTML = '<div class="card red"><p style="margin:0">No pude calcular la nómina: ' + esc(e.message) + '</p></div>'; }
  });
}

function htmlRef() {
  var R = S.ref;
  if (!R) {
    return '<div class="card"><p class="muted" style="margin:0 0 10px">Para los insumos que nunca has registrado como compra (por ejemplo, las gaseosas), aquí escribes cuánto te cuestan. Se usa solo mientras no haya una compra registrada en la caja. No cambia nada en la caja.</p><button class="btn" data-act="cargarRef">' + (S.refCargando ? 'Cargando...' : 'Ver los insumos sin precio') + '</button></div>';
  }
  var sin = R.items.filter(function (x) { return x.real === null; }), con = R.items.filter(function (x) { return x.real !== null; });
  var h = '';

    h += '<div class="card"><h3>Insumos sin compras registradas (' + sin.length + ')</h3><p class="muted" style="margin:0 0 6px">Escribe lo que te cuesta cada uno. Los más usados en los últimos 90 días salen primero. Déjalo vacío para quitar el precio.</p>';

    });

function seccionRef() { return '<h2>Precios de referencia de los insumos</h2><div id="refBox">' + htmlRef() + '</div>'; }

function pintarPanel() {
  var r = S.res, t = r.tot, h = '';

  h += '<div class="card no-print"><div class="row sp"><button class="btn sm" data-act="mprev">◀</button><div style="font:700 20px var(--head)">' + esc(tituloMes(r.ym)) + '</div><button class="btn sm" data-act="mnext">▶</button></div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="actualizar">Actualizar</button><button class="btn sm" data-act="excel">Descargar Excel</button><button class="btn sm" data-act="pdf">Guardar como PDF</button></div><p class="muted" style="margin:8px 0 0">Lee la hoja de la caja (solo lectura) y guarda el resultado 2 minutos.</p></div>';
  h += bannerHistorico(r);
  h += '<div class="grid g3">';
  h += '<div class="kpi"><div class="l">Ventas</div><div class="v">' + fmt(t.ventas) + '</div><div class="s">' + t.pedidos + ' pedidos · ' + r.dias.length + ' días</div></div>';
  h += '<div class="kpi"><div class="l">Balance (entró − salió)</div><div class="v ' + (t.balance >= 0 ? 'pos' : 'neg') + '">' + fmt(t.balance) + '</div><div class="s">incluye domicilios y compras</div></div>';
  h += '<div class="kpi"><div class="l">Gastos</div><div class="v">' + fmt(t.gastos) + '</div><div class="s">' + pct(t.ventas > 0 ? t.gastos / t.ventas : 0) + ' de las ventas</div></div>';
  h += '<div class="kpi"><div class="l">Compras de insumos</div><div class="v">' + fmt(t.compras) + '</div><div class="s">' + pct(t.ventas > 0 ? t.compras / t.ventas : 0) + ' de las ventas' + (t.inversion > 0 ? ' · inversión aparte ' + fmt(t.inversion) : '') + '</div></div>';
  h += '<div class="kpi"><div class="l">Trabajadores</div><div class="v">' + fmt(t.trabajadores) + '</div><div class="s">turnos ' + fmt(t.base) + ' · domicilios ' + fmt(t.domPagado) + (t.extras > 0 ? ' · extras ' + fmt(t.extras) : '') + '</div></div>';
  h += '<div class="kpi"><div class="l">Domicilios cobrados</div><div class="v">' + fmt(t.dom) + '</div><div class="s">se pagan a quien los lleva</div></div>';
  h += '</div>';

  var pe = r.pe, hecho = t.ventas;

  } else {
    var pr = pe.ventasEquilibrio > 0 ? hecho / pe.ventasEquilibrio : 0, falta = Math.max(0, pe.ventasEquilibrio - hecho);

    h += '<div class="card"><h3>Cómo se calcula</h3><p class="muted" style="margin:0"><b>Costos fijos</b> del mes: ' + fmt(pe.fijos) + ' (gastos fijos ' + (pe.fijosCosteo ? 'del costeo ' : '') + fmt(pe.gastosFijos) + ' + turnos y extras de trabajadores ' + fmt(t.base + t.extras) + '). <b>Costos variables</b>: ' + fmt(pe.variableCosto) + ' (' + (pe.base === 'recetas' ? 'costo de lo vendido según recetas ' : 'compras de insumos ') + fmt(pe.costoVentas) + ' + otros gastos ' + fmt(pe.gastosVariables) + '), o sea ' + pct(pe.variablePct) + ' de las ventas. Punto de equilibrio = fijos ÷ (1 − ' + pct(pe.variablePct) + '). ' + (pe.base === 'recetas' ? 'El costo de lo vendido sale de las recetas y del precio promedio de compra de cada insumo.' : 'Es una aproximación con las compras del mes, porque todavía no hay costos de receta.') + '</p></div>';
  }
  h += '</div>';

  h += '<h2>Meta y cierre del mes</h2><div class="grid g2">';
  var metaTxt = r.meta > 0 ? fmt(r.meta) : 'sin meta';
  var base = r.meta > 0 ? r.meta : (pe.ventasEquilibrio || 0);
  h += '<div class="card"><h3>Meta de ventas del mes</h3><div class="row"><div class="grow"><input id="iMeta" inputmode="numeric" placeholder="Escribe la meta" value="' + (r.meta > 0 ? r.meta : '') + '"></div><button class="btn pri" data-act="guardarMeta">Guardar</button></div>';
  if (base > 0) { var pm = hecho / base; h += '<div class="bar"><i class="' + (pm >= 1 ? 'ok' : '') + '" style="width:' + Math.min(100, pm * 100).toFixed(0) + '%"></i></div><p style="margin:0">Llevas ' + fmt(hecho) + ' de ' + (r.meta > 0 ? metaTxt : 'el punto de equilibrio') + ' (' + pct(pm) + ').</p>'; }
  else { h += '<p class="muted">Escribe una meta para ver el avance.</p>'; }

  h += seccionCompras(r);

  h += seccionInventario();
  h += seccionMermas(r);
  h += seccionRegalado(r);

  var M = [['Efectivo', 'efectivo'], ['Bold', 'nequi'], ['Llaves', 'transferencia']], totM = t.inM.efectivo + t.inM.nequi + t.inM.transferencia;

  if (r.dias.length) { h += '<tr class="tot"><td>Total</td><td>' + t.pedidos + '</td><td>' + fmt(t.ventas) + '</td><td>' + fmt(t.gastos) + '</td><td>' + fmt(t.compras) + '</td><td>' + fmt(t.trabajadores) + '</td><td>' + fmt(t.balance) + '</td><td></td></tr>'; }
