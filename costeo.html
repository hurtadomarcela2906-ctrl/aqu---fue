<style>
:root{--bg:#FFF7F3;--card:#FFFFFF;--ink:#24171A;--muted:#7B6669;--line:#F1DFDA;--red:#C8202B;--red-ink:#A3141E;--red-s:#FDECEA;--gold:#F2B134;--gold-s:#FFF3D6;--mustard-soft:#FFF3D6;--ok:#1D7F4A;--ok-s:#E2F4E9;--bad:#A3141E;--bad-s:#FDECEA;--warn:#9A5A00;--warn-s:#FFF0D9;--chip:#F4ECEA;--f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.top{background:#8B1E1E;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logobox{display:inline-flex;background:#fff;border-radius:10px;padding:3px 10px}
.logobox img{height:38px;width:auto;display:block}
.tt{flex:1;font-weight:700}
.tt small{display:block;font-weight:400;opacity:.85;font-size:12px}
main{max-width:860px;margin:0 auto;padding:14px}
h2{font:700 21px Georgia,serif;margin:6px 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.warn{background:var(--warn-s);border-color:var(--gold)}
.card.bad{background:var(--bad-s);border-color:var(--bad)}
.card.ok{background:var(--ok-s);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:640px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font:700 20px Georgia,serif;margin-top:2px;word-break:break-word}
.kpi .s{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 8px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.btn{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font:600 14px system-ui,sans-serif;cursor:pointer;min-height:42px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger{background:var(--bad-s);border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn.block{display:block;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:500 15px system-ui,sans-serif;min-height:42px}
input[disabled],select[disabled]{opacity:.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--muted)}
.item .r{text-align:right}
.prod{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.prod .nm{flex:1;min-width:0;font-weight:600}
.prod .nm small{display:block;font-weight:400;color:var(--muted)}
.qty{width:64px;text-align:center;padding:8px 4px}
.step{width:42px;height:42px;padding:0;font-size:20px}
.tabsub{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto}
.tabsub button{flex:1 0 auto;white-space:nowrap}
.tabsub button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daygrid .dh{text-align:center;font:600 11px system-ui,sans-serif;color:var(--muted)}
.dbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 0;font:600 14px system-ui,sans-serif;cursor:pointer}
.dbtn.cerr{background:var(--ok-s);border-color:var(--ok);color:var(--ok)}
.dbtn.abi{background:var(--warn-s);border-color:var(--gold);color:var(--warn)}
.dbtn.hoy{box-shadow:inset 0 0 0 2px var(--gold)}
.dbtn.sel{background:var(--red);border-color:var(--red);color:#fff}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;background:var(--chip);color:var(--muted)}.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.bad{background:var(--bad-s);color:var(--bad)}.pill.warn{background:var(--warn-s);color:var(--warn)}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:var(--gold)}
.bar>i.ok{background:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
tr.tot td{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:12px 2px;font:600 12px system-ui,sans-serif;cursor:pointer}
nav button[aria-current="true"]{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.center{max-width:420px;margin:30px auto;padding:0 14px}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
/* tema Aquí Fue, igual al de la caja */
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;background-image:radial-gradient(var(--mustard-soft) 1.6px,transparent 1.7px);background-size:26px 26px;min-height:100vh}
button,input,select,textarea{font-family:var(--f-body)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font:800 1.25rem var(--f-display);letter-spacing:-.01em;margin:18px 0 10px;color:var(--ink)}
h3{font:800 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.top{background:var(--card);color:var(--ink);padding:0;display:block;position:relative;z-index:5;border:0}
.topin{display:flex;align-items:center;gap:12px;padding:10px 16px;margin:0 auto}
.logo{height:46px;width:auto;display:block}
.tt{flex:1;font:800 1.05rem var(--f-display);color:var(--red-ink);line-height:1.1}
.tt small{display:block;font:600 .75rem var(--f-body);color:var(--muted);margin-top:2px}
.checker{height:10px;background:conic-gradient(var(--red) 25%,#fff 0 50%,var(--red) 0 75%,#fff 0) 0 0/20px 20px;border-bottom:1px solid var(--line)}
.card{border-radius:14px;border-color:var(--line)}
.kpi{border-radius:12px;border-color:var(--line)}
.kpi .l{font-weight:700}
.kpi .v{font-family:var(--f-display);font-weight:800}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 16px;font:800 14px var(--f-body)}
.btn:hover{border-color:var(--red);color:var(--red-ink)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-ink);border-color:var(--red-ink);color:#fff}
.btn.sm{padding:6px 12px;font-size:13px}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;font-family:var(--f-body)}
label{font-weight:700}
.pill{font-weight:800}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
table{font-variant-numeric:tabular-nums}
#toast{background:var(--ink);border-radius:12px;font-weight:700}
details summary{color:var(--red-ink);font-weight:800}

body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.topin{max-width:860px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(60,20,20,.06);display:flex;justify-content:space-around;padding:4px max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
nav button{flex:1 1 0;min-width:0;border:0;background:none;padding:8px 1px;border-radius:10px;font:800 min(.68rem,3vw) var(--f-body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;box-shadow:none}
nav button svg{width:20px;height:20px}
nav button[aria-current="true"]{background:var(--red);color:#fff;box-shadow:none}
.modalbg{background:rgba(36,23,26,.45)}
.modal{border-radius:20px 20px 0 0}
#toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.tabsub button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.dbtn.hoy{box-shadow:inset 0 0 0 2px var(--gold)}
</style>
</head>

function tituloMes(ym) { return MESES[+ym.slice(5) - 1] + ' ' + ym.slice(0, 4); }
function mesMas(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5) - 1 + n; var d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }

function toast(t) { var el = $('#toast'); el.textContent = t; el.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { el.className = ''; }, 2600); }
function guardarTok(t) { memTok = t; try { window.localStorage.setItem('af_tok', t || ''); } catch (e) {} }
function leerTok() { try { var t = window.localStorage.getItem('af_tok'); if (t) { return t; } } catch (e) {} return memTok; }

function api(fn, args) {
  return new Promise(function (resolve, reject) {
    var a = args || [];
    function fin(r) {
      if (r && r.ok) { resolve(r.val); return; }
      var e = new Error((r && r.err) || 'Error desconocido');
      e.sesion = !!(r && r.sesion === false);
      reject(e);
    }
    if (window.CAJA_API) {
      fetch(window.CAJA_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, token: S.token, args: a }) })
        .then(function (r) { return r.json(); }).then(fin)
        .catch(function () { reject(new Error('No hay conexión con el servidor.')); });
    } else if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(fin).withFailureHandler(function (e) { reject(new Error((e && e.message) || 'Error de conexión.')); }).dispatch(fn, S.token, a);
    } else {
      reject(new Error('No hay conexión con el servidor.'));
    }
  });
}

function manejarError(e) {
  if (e && e.sesion) { S.token = null; guardarTok(''); pantallaLogin('Tu sesión venció. Entra de nuevo.'); return; }
  toast((e && e.message) || 'Algo salió mal.');
}

function pintar(h) { $('#app').innerHTML = h; }

function iniciar() {
  S.token = leerTok();
  api('estado', []).then(function (est) {
    S.est = est;
    $('#sub').textContent = est.negocio || 'Aquí Fue';
    if (!est.instalado) { pantallaAviso('Falta un paso', 'En Apps Script, ejecuta la función instalar y vuelve a abrir esta página.'); }
    else if (!est.tieneClave) { pantallaCrear(); }
    else if (S.token) { cargarInicial(); }
    else { pantallaLogin(''); }
  }).catch(function (e) { pantallaAviso('No pude conectar', e.message); });
}

function pantallaAviso(t, m) { pintar('<div class="center"><div class="card"><h2>' + esc(t) + '</h2><p>' + esc(m) + '</p><button class="btn pri block" data-act="reintentar">Reintentar</button></div></div>'); }

function cargarInicial() {
  return api('catalogo', []).then(function (c) {
    S.cat = c; S.ver = c.version;
    S.fecha = hoyNeg(); S.ym = S.fecha.slice(0, 7);
    return cargarMes(S.ym);
  }).then(function () { pintarApp(); sincronizarAlAbrir(false); }).catch(manejarError);

var TABS = [['inicio', 'Inicio'], ['dia', 'Día'], ['catalogo', 'Catálogo'], ['costeo', 'Costeo'], ['ajustes', 'Ajustes']];

function pintarApp() {
  $('#sub').textContent = S.cat.params.negocio;
  pintar('<main id="vista"></main><nav>' + TABS.map(function (t) { return '<button data-tab="' + t[0] + '">' + (ICONO[t[0]] || '') + '<span>' + t[1] + '</span></button>'; }).join('') + '</nav>');
  irA(S.tab);
}

function irA(tab) {
  S.tab = tab;
  $$('nav button').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-tab') === tab ? 'true' : 'false'); });
  var f = { inicio: vistaInicio, dia: vistaDia, catalogo: vistaCatalogo, costeo: vistaCosteo, ajustes: vistaAjustes }[tab];
  if (tab === 'dia' && (!S.dia || S.ym !== S.dia.fecha.slice(0, 7))) {
    abrirDia(S.dia ? S.dia.fecha : S.fecha);
    return;
  }
  $('#vista').innerHTML = f();
  window.scrollTo(0, 0);
  if (tab === 'dia') { refrescarDia(); }
}

function repintar() {
  var y = window.scrollY;
  var f = { inicio: vistaInicio, dia: vistaDia, catalogo: vistaCatalogo, costeo: vistaCosteo, ajustes: vistaAjustes }[S.tab];
  $('#vista').innerHTML = f();
  window.scrollTo(0, y);
  if (S.tab === 'dia') { refrescarDia(); }
}

function agregar(m) {
  var a = { dias: 0, cerrados: 0, ventas: 0, extra: 0, dom: 0, cv: 0, mo: 0, pagoAux: 0, pagoDomi: 0, bono: 0, gastosEf: 0, uds: 0, porProd: {} };
  m.dias.forEach(function (d) {
    a.dias++;
    if (d.estado === 'Cerrado') { a.cerrados++; }
    a.ventas += d.ventasProd + d.extra; a.extra += d.extra; a.dom += d.dom; a.cv += d.cv; a.mo += d.mo;
    a.pagoAux += d.pagoAux; a.pagoDomi += d.pagoDomi; a.bono += d.bono; a.gastosEf += d.gastosEf;
    for (var k in d.u) { a.uds += d.u[k]; a.porProd[k] = (a.porProd[k] || 0) + d.u[k]; }
  });
  return a;
}

function moEsperada() { var t = 0; S.cat.productos.forEach(function (p) { if (p.activo) { t += p.esperadas * p.mo; } }); return t; }

function turnosAuxMes(ym) {
  var y = +ym.slice(0, 4), mo = +ym.slice(5) - 1, n = new Date(y, mo + 1, 0).getDate(), t = 0;
  for (var i = 1; i <= n; i++) { t += S.cat.params.turnosAux[new Date(y, mo, i).getDay()]; }
  return t;
}

function turnosDomiMes(ym) {
  var y = +ym.slice(0, 4), mo = +ym.slice(5) - 1, n = new Date(y, mo + 1, 0).getDate(), t = 0;
  for (var i = 1; i <= n; i++) { t += S.cat.params.turnosDomi[new Date(y, mo, i).getDay()]; }
  return t;
}

function tarjetaFijos(a) {
  var fijos = S.cat.fijosTotal, deja = a.ventas - a.cv - a.mo;
  var h = '<div class="card"><h3>Lo que dejan las ventas para los gastos fijos</h3>';
  if (a.dias === 0) {
    h += '<p class="hint" style="margin-bottom:0">Aún no hay días registrados en este mes.</p>';
  } else {
    var pr = fijos > 0 ? deja / fijos : 0;
    h += '<div class="grid"><div><div class="muted">Dejado hasta hoy (ventas − materiales − mano de obra de las recetas)</div><div style="font:700 20px Georgia,serif">' + fmt(deja) + '</div></div><div><div class="muted">Gastos fijos del mes</div><div style="font:700 20px Georgia,serif">' + fmt(fijos) + '</div></div></div>';
    h += '<div class="bar"><i class="' + (pr >= 1 ? 'ok' : '') + '" style="width:' + Math.max(0, Math.min(100, pr * 100)).toFixed(0) + '%"></i></div>';
    h += '<p style="margin:0">' + (pr >= 1 ? 'Ya cubriste los gastos fijos del mes y sobran <b>' + fmt(deja - fijos) + '</b>.' : 'Llevas el <b>' + pct(Math.max(0, pr)) + '</b> de los gastos fijos del mes; faltan <b>' + fmt(fijos - deja) + '</b>.') + '</p>';
  }
  return h + '</div>';
}

function tarjetaMO(a, ym) {
  var p = S.cat.params;
  var dif = a.mo - a.pagoAux;
  var h = '<div class="card ' + (a.dias === 0 ? '' : (dif >= 0 ? 'ok' : 'warn')) + '"><h3>Mano de obra de las recetas vs pago de la auxiliar</h3>';
  if (a.dias === 0) {
    h += '<p class="hint">Aún no hay días registrados en este mes.</p>';
  } else {
    h += '<div class="grid"><div><div class="muted">Mano de obra que traen las recetas vendidas</div><div style="font:700 20px Georgia,serif">' + fmt(a.mo) + '</div></div><div><div class="muted">Pagado a la auxiliar de cocina</div><div style="font:700 20px Georgia,serif">' + fmt(a.pagoAux) + '</div></div></div>';
    h += '<div class="bar"><i class="' + (dif >= 0 ? 'ok' : '') + '" style="width:' + Math.min(100, a.pagoAux > 0 ? a.mo / a.pagoAux * 100 : 100).toFixed(0) + '%"></i></div>';
    h += '<p style="margin:0">' + (dif >= 0 ? 'Las recetas cubren el pago de la auxiliar y sobran <b>' + fmt(dif) + '</b>.' : 'Las recetas todavía no cubren el pago de la auxiliar: faltan <b>' + fmt(-dif) + '</b>.') + '</p>';
  }
  var esp = moEsperada(), prog = turnosAuxMes(ym) * p.turnoAux;
  h += '<p class="hint" style="margin-top:10px">Mes completo con tus ventas esperadas: las recetas aportan ' + fmt(esp) + ' y la auxiliar costaría ' + fmt(prog) + ' (' + turnosAuxMes(ym) + ' turnos). ' + (esp >= prog ? 'Cubre.' : 'Faltarían ' + fmt(prog - esp) + '.') + '</p></div>';
  return h;
}

function vistaInicio() {
  var a = agregar(S.mes || { dias: [] }), h = '';
  h += '<h2>Hola</h2><div id="estadoCajaBox">' + htmlEstadoCaja() + '</div>';
  h += '<div class="card"><div class="row sp"><button class="btn sm" data-act="mprev">◀</button><b>' + esc(tituloMes(S.ym)) + '</b><button class="btn sm" data-act="mnext">▶</button></div></div>';
  var hoy = hoyNeg();
  var dh = null;
  (S.mes ? S.mes.dias : []).forEach(function (d) { if (d.fecha === hoy) { dh = d; } });
  h += '<div class="card"><h3>Hoy, ' + esc(fechaLarga(hoy)) + '</h3><p class="hint">' + (dh ? 'El día está ' + dh.estado.toLowerCase() + '.' : 'Aún no registras ventas de hoy.') + '</p><button class="btn pri block" data-act="irHoy">' + (dh && dh.estado === 'Cerrado' ? 'Ver el día de hoy' : 'Registrar el día de hoy') + '</button></div>';
  var sinCerrar = (S.mes ? S.mes.dias : []).filter(function (d) { return d.estado !== 'Cerrado' && d.fecha < hoy; });
  if (sinCerrar.length) { h += '<div class="card warn"><b>Tienes ' + sinCerrar.length + (sinCerrar.length === 1 ? ' día sin cerrar' : ' días sin cerrar') + '</b><p class="hint" style="margin-bottom:0">' + sinCerrar.map(function (d) { return d.fecha.slice(8); }).join(', ') + ' de ' + esc(MESES[+S.ym.slice(5) - 1]) + '. Toca el día en la pestaña Día para cerrarlo.</p></div>'; }
  h += '<div class="grid g4"><div class="kpi"><div class="l">Ventas del mes</div><div class="v">' + fmt(a.ventas) + '</div><div class="s">' + a.dias + (a.dias === 1 ? ' día' : ' días') + '</div></div>';
  h += '<div class="kpi"><div class="l">Costo de insumos</div><div class="v">' + fmt(a.cv) + '</div></div>';
  h += '<div class="kpi"><div class="l">Margen sobre insumos</div><div class="v ' + (a.ventas - a.cv >= 0 ? 'pos' : 'neg') + '">' + fmt(a.ventas - a.cv) + '</div><div class="s">' + pct(a.ventas > 0 ? (a.ventas - a.cv) / a.ventas : 0) + '</div></div>';
  h += '<div class="kpi"><div class="l">Domicilios cobrados</div><div class="v">' + fmt(a.dom) + '</div><div class="s">bono pagado ' + fmt(a.bono) + '</div></div></div><div style="height:12px"></div>';
  h += tarjetaMO(a, S.ym);
  h += tarjetaFijos(a);
  var dias = (S.mes ? S.mes.dias : []).slice().reverse().slice(0, 10);
  h += '<div class="card"><h3>Últimos días</h3>';
  if (!dias.length) { h += '<p class="hint">Sin días registrados.</p>'; }
  dias.forEach(function (d) { h += '<div class="item" data-act="pickDay" data-date="' + d.fecha + '" style="cursor:pointer"><div class="grow"><div class="t">' + esc(fechaLarga(d.fecha)) + '</div><div class="s">' + d.estado + '</div></div><div class="r"><b>' + fmt(d.ventasProd + d.extra) + '</b></div></div>'; });
  return h + '</div>';
}

function borradorDe(r, fecha) {
  if (S.pend[fecha]) { return S.pend[fecha]; }
  if (r.existe) {
    return { fecha: fecha, estado: r.estado, existe: true, fuente: r.fuente || '', manual: !!r.manual, base: r.base, u: JSON.parse(JSON.stringify(r.u || {})), extra: r.extra, dom: r.dom, digital: r.digital, aux: r.aux, domi: r.domi, nota: r.nota, contado: r.contado, motivo: r.motivo, gastos: (r.gastos || []).map(function (g) { return { categoria: g.categoria, concepto: g.concepto, valor: g.valor, medio: g.medio }; }) };
  }
  var dow = parseYmd(fecha).getDay(), p = S.cat.params;
  return { fecha: fecha, estado: 'Nuevo', existe: false, base: p.baseCaja, u: {}, extra: 0, dom: 0, digital: 0, aux: p.turnosAux[dow], domi: p.turnosDomi[dow], nota: '', contado: null, motivo: '', gastos: [] };
}

function guardarPendiente() {
  if (S.dia && S.sucio && S.dia.estado !== 'Cerrado') { S.pend[S.dia.fecha] = S.dia; }
  else if (S.dia) { delete S.pend[S.dia.fecha]; }
}

function abrirDia(fecha) {
  guardarPendiente();
  var ym = fecha.slice(0, 7);
  var p1 = ym !== S.ym ? cargarMes(ym) : Promise.resolve();
  return p1.then(function () { return api('dia', [fecha]); }).then(function (r) {
    S.fecha = fecha; S.dia = borradorDe(r, fecha); S.sucio = !!S.pend[fecha];
    if (S.tab !== 'dia') { S.tab = 'dia'; $$('nav button').forEach(function (b) { b.setAttribute('aria-current', b.getAttribute('data-tab') === 'dia' ? 'true' : 'false'); }); }
    $('#vista').innerHTML = vistaDia();
    refrescarDia();
  }).catch(manejarError);
}

function calcDia(d) {
  var c = S.cat, p = c.params, vp = 0, cv = 0, mo = 0, uds = 0;
  c.productos.forEach(function (pr) {
    var q = num(d.u[pr.id]);
    if (q > 0) { vp += q * pr.precio; cv += q * pr.mp; mo += q * pr.mo; uds += q; }
  });
  var extra = num(d.extra), dom = num(d.dom);
  cv += extra * p.costoExtraPct / 100;
  var cobrado = vp + extra + dom, digital = num(d.digital), efv = cobrado - digital;
  var pagoAux = Math.round(num(d.aux)) * p.turnoAux, pagoDomi = Math.round(num(d.domi)) * p.turnoDomi, bono = dom * p.bonoDomiciliosPct / 100;
  var gef = 0;
  d.gastos.forEach(function (g) { if (g.medio === 'Efectivo') { gef += num(g.valor); } });
  var esperado = num(d.base) + efv - gef - pagoAux - pagoDomi - bono;
  return { vp: vp, extra: extra, dom: dom, cobrado: cobrado, digital: digital, efv: efv, cv: cv, mo: mo, uds: uds, pagoAux: pagoAux, pagoDomi: pagoDomi, bono: bono, gef: gef, esperado: esperado };
}

function calendario(fecha) {
  var ym = fecha.slice(0, 7), y = +ym.slice(0, 4), m = +ym.slice(5), n = new Date(y, m, 0).getDate();
  var off = (new Date(y, m - 1, 1).getDay() + 6) % 7, hoy = hoyNeg();
  var mapa = {};
  if (S.mes && S.ym === ym) { S.mes.dias.forEach(function (d) { mapa[d.fecha] = d.estado; }); }
  var h = '<div class="row sp" style="margin-bottom:8px"><button class="btn sm" data-act="dmprev">◀</button><b>' + esc(tituloMes(ym)) + '</b><button class="btn sm" data-act="dmnext">▶</button></div>';
  h += '<div class="daygrid">' + ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(function (x) { return '<span class="dh">' + x + '</span>'; }).join('');
  for (var i = 0; i < off; i++) { h += '<span></span>'; }
  for (var k = 1; k <= n; k++) {
    var f = ym + '-' + pad(k), st = mapa[f];
    h += '<button class="dbtn' + (f === fecha ? ' sel' : '') + (st === 'Cerrado' ? ' cerr' : (st ? ' abi' : '')) + (f === hoy ? ' hoy' : '') + '" data-act="pickDay" data-date="' + f + '">' + k + '</button>';
  }
  return h + '</div><p class="hint">Verde: día cerrado. Amarillo: guardado pero sin cerrar. Borde dorado: hoy.</p>';
}

function vistaDia() {
  var d = S.dia, c = S.cat, cerrado = d.estado === 'Cerrado', dis = cerrado ? ' disabled' : '';
  var h = '<div class="card">' + calendario(d.fecha) + '</div>';

  });
  h += '</div>';
  h += '<div class="card"><h3>Otras ventas y domicilios</h3><label>Bebidas y otras ventas ($)</label><input id="dExtra" type="number" inputmode="decimal" value="' + (num(d.extra) || '') + '" placeholder="0"' + dis + '>';
  h += '<label>Domicilios cobrados ($, valor total de los domicilios)</label><input id="dDom" type="number" inputmode="decimal" value="' + (num(d.dom) || '') + '" placeholder="0"' + dis + '>';

function payloadDia() {

function cerrarDia() {

function unidadMapa() {
  var m = {};
  S.cat.insumos.forEach(function (i) { m[i.id] = i.costoUnidad; });
  S.cat.salsas.forEach(function (s) { m[s.id] = s.costoUnidad; });
  return m;
}

function precioAmigable(i) {
  var u = i.costoUnidad || 0;
  if (i.unidad === 'g') { return { v: u * 1000, por: 'kilo' }; }
  if (i.unidad === 'ml') { return { v: u * 1000, por: 'litro' }; }
  return { v: u, por: i.unidad || 'unidad' };
}

function insumoRaro(i) {
  var pa = precioAmigable(i);
  return (i.unidad === 'g' || i.unidad === 'ml') ? pa.v > 120000 : pa.v > 300000;
}

function descCompra(i) {
  var c = i.cantidad;
  if (i.unidad === 'g' && c >= 1000) { return String(c / 1000).replace('.', ',') + ' kilos'; }
  if (i.unidad === 'ml' && c >= 1000) { return String(c / 1000).replace('.', ',') + ' litros'; }
  return String(c).replace('.', ',') + ' ' + (i.unidad === 'unidad' ? (c === 1 ? 'unidad' : 'unidades') : i.unidad);
}

function usosDeInsumo(id) {
  var o = [];
  S.cat.productos.forEach(function (p) { if ((S.cat.recetas[p.id] || []).some(function (l) { return l.ref === id; })) { o.push(p.nombre); } });
  S.cat.salsas.forEach(function (sv) { if ((S.cat.recetas[sv.id] || []).some(function (l) { return l.ref === id; })) { o.push(sv.nombre + ' (salsa)'); } });
  return o;
}

function alertasDatos() {
  var L = [];
  S.cat.insumos.filter(function (i) { return i.activo && insumoRaro(i); }).forEach(function (i) { var pa = precioAmigable(i); L.push({ tipo: 'insumo', id: i.id, txt: i.nombre + ' figura a ' + fmt(pa.v) + ' por ' + pa.por + ' (' + fmt(i.costoUnidad) + ' por ' + i.unidad + ')' }); });
  if (L.length) { return L; }
  S.cat.productos.filter(function (p) { return p.activo && p.precio > 0 && p.mp > p.precio * 2; }).forEach(function (p) { L.push({ tipo: 'producto', id: p.id, txt: p.nombre + ': los materiales cuestan ' + fmt(p.mp) + ' y se vende en ' + fmt(p.precio) }); });
  return L;
}

function vistaCosteo() {

  var pagoAux = turnosAuxMes(ym) * p.turnoAux, auxNo = pagoAux - mo, domi = turnosDomiMes(ym) * p.turnoDomi;
  var util = deja - fijos - auxNo - domi;
  var h = htmlAlertasDatos() + '<h2>Costeo por producto</h2><p class="hint">Costo real = materiales (la receta) + mano de obra (minutos de proceso × ' + fmt2(c.moMinuto) + ' por minuto, al salario mínimo) + CIF (los gastos fijos, ' + fmt(fijos) + ' al mes, repartidos según lo que vende cada producto).</p>';
  h += '<div class="card"><h3>Resumen de ' + esc(tituloMes(ym)) + ' con tus ventas esperadas</h3><table><tbody>';
  h += '<tr><td>Ventas esperadas</td><td>' + fmt(ventas) + '</td></tr><tr><td>(−) Materiales</td><td>' + fmt(mp) + '</td></tr><tr><td>(−) Mano de obra de las recetas</td><td>' + fmt(mo) + '</td></tr>';
  h += '<tr class="tot"><td>Deja para gastos fijos</td><td>' + fmt(deja) + '</td></tr><tr><td>(−) Gastos fijos (CIF)</td><td>' + fmt(fijos) + '</td></tr>';
  h += '<tr><td>(−) Pago de la auxiliar que las recetas no cubren (' + turnosAuxMes(ym) + ' turnos)</td><td>' + fmt(auxNo) + '</td></tr><tr><td>(−) Domiciliario (' + turnosDomiMes(ym) + ' turnos)</td><td>' + fmt(domi) + '</td></tr>';
  h += '<tr class="tot"><td>Utilidad estimada del mes</td><td class="' + (util >= 0 ? 'pos' : 'neg') + '">' + fmt(util) + '</td></tr></tbody></table>';

  c.productos.filter(function (x) { return x.activo; }).forEach(function (x) {

    h += '<tr class="tot"><td>Costo real</td><td>' + fmt(x.costo) + '</td></tr><tr class="tot"><td>Queda</td><td class="' + (x.queda >= 0 ? 'pos' : 'neg') + '">' + fmt(x.queda) + ' (' + pct(x.precio > 0 ? x.queda / x.precio : 0) + ')</td></tr></tbody></table>';
    h += '<p class="hint" style="margin:8px 0 0">Deja <b>' + fmt(x.deja) + '</b> por unidad para pagar los gastos fijos' + (x.esperadas > 0 ? ' · con ' + x.esperadas + ' al mes aporta <b>' + fmt(x.deja * x.esperadas) + '</b>' : '') + '.' + (x.sugerido > 0 ? ' Con el precio sugerido (' + fmt(x.sugerido) + ') dejaría <b>' + fmt(x.sugerido - x.mp - x.mo) + '</b>.' : '') + '</p><button class="btn sm" data-act="detalle" data-id="' + x.id + '" style="margin-top:8px">Cómo se calcula</button></div>';

}

document.addEventListener('input', function (ev) {
  var t = ev.target, d = S.dia;
  if (t.getAttribute && t.getAttribute('data-hprecio')) {
    var k2 = t.getAttribute('data-hprecio');
    (S.hCols || []).forEach(function (c) { if (c.clave === k2) { c.precio = pesos(t.value); c.editado = true; } });
    var tp = $('#hTotalPesos'); if (tp) { tp.textContent = fmt(totalPesosCols()); }
    var wf = document.getElementById('falta_' + k2); if (wf) { wf.style.display = pesos(t.value) > 0 ? 'none' : ''; }
    return;
  }
  if (t.id === 'hText') { S.histTexto = t.value; return; }
  if (t.id === 'hNota') { S.histNota = t.value; return; }
  if (t.id === 'mCant' || t.id === 'mCosto') { previewInsumo(); return; }
  if (t.getAttribute('data-u') && d) { d.u[t.getAttribute('data-u')] = Math.max(0, Math.round(num(t.value))); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dExtra' && d) { d.extra = num(t.value); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dDom' && d) { d.dom = num(t.value); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dDigital' && d) { d.digital = num(t.value); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dBase' && d) { d.base = num(t.value); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dNota' && d) { d.nota = t.value; S.sucio = true; }
  else if (t.id === 'dContado' && d) { d.contado = t.value === '' ? null : num(t.value); S.sucio = true; refrescarDia(); }
  else if (t.id === 'dMotivo' && d) { d.motivo = t.value; S.sucio = true; }
  else if (t.getAttribute('data-g') && d) { var p = t.getAttribute('data-g').split(':'); d.gastos[+p[0]][p[1]] = p[1] === 'valor' ? num(t.value) : t.value; S.sucio = true; refrescarDia(); }
  else if (t.getAttribute('data-l') && S.edit) { var q = t.getAttribute('data-l').split(':'); if (q[1] === 'cant') { S.edit.lineas[+q[0]].cant = t.value; resumenLineas(); } }
  else if ((t.id === 'mPrecio' || t.id === 'mMin' || t.id === 'mRinde') && S.edit && S.edit.lineas) { resumenLineas(); }
});

document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'hTipo' || t.id === 'hMes' || t.id === 'hAnio') {
    if ($('#hText')) { S.histTexto = $('#hText').value; }
    if ($('#hNota')) { S.histNota = $('#hNota').value; }
    if (t.id === 'hTipo') { S.hTipo = t.value; } else if (t.id === 'hMes') { S.hMes = t.value; } else { S.hAnio = t.value; }
    S.histPrev = null; S.histPrevYm = ''; S.hPrevProd = null; S.hCols = null;
    $('#histBox').innerHTML = htmlHistorico();
    return;
  }
  if (t.getAttribute && t.getAttribute('data-hprod')) {
    var cl = t.getAttribute('data-hprod'), pr = null;
    (S.hCols || []).forEach(function (c) { if (c.clave === cl) { pr = c; } });
    if (pr) {
      pr.productoId = t.value;
      var prod = null; ((S.hPrevProd || {}).productos || []).forEach(function (x) { if (x.id === t.value) { prod = x; } });
      if (prod && !pr.editado) { pr.precio = prod.precio; }
      $('#histBox').innerHTML = htmlHistorico();
    }
    return;
  }
  if (t.getAttribute && t.getAttribute('data-sync')) {
    var o = {}; o[t.getAttribute('data-sync')] = t.checked;
    api('guardarSyncCfg', [o]).then(function (a) { if (S.cajaEst) { S.cajaEst.auto = a; } toast('Guardado'); }).catch(manejarError);
    return;
  }
  if (t.getAttribute && t.getAttribute('data-eq')) {
    api('guardarEquivalencia', [t.getAttribute('data-eq'), t.getAttribute('data-id'), t.value]).then(function (e) { S.cajaEst = e; var el = $('#cajaBox'); if (el) { el.innerHTML = htmlCajaAjustes(); } toast('Pareja guardada. Trayendo de la caja...'); return sincronizarAlAbrir(true); }).catch(manejarError);
    return;
  }
  if (t.id === 'mMide') { var m = t.value; $('#mCompraU').innerHTML = opcionesCompra(m, m === 'peso' ? 'kg' : (m === 'volumen' ? 'l' : 'und')); previewInsumo(); return; }
  if (t.id === 'mCompraU') { previewInsumo(); return; }
  if (t.getAttribute('data-pm')) {
    api('actualizarPrecio', [t.getAttribute('data-pm'), num(t.value)]).then(recargarCat).then(function () { toast('Precio actualizado: los costos se recalcularon'); repintar(); }).catch(manejarError);
  } else if (t.getAttribute('data-l') && S.edit && t.getAttribute('data-l').split(':')[1] === 'ref') {
    var p = t.getAttribute('data-l').split(':'); S.edit.lineas[+p[0]].ref = t.value; pintarLineas();
  } else if (t.getAttribute('data-g') && S.dia) {
    var q = t.getAttribute('data-g').split(':'); S.dia.gastos[+q[0]][q[1]] = t.value; S.sucio = true; refrescarDia();
  }
});

setInterval(function () {
  if (!S.token || !S.cat || S.sucio || $('#modal').innerHTML || $('#modal2').innerHTML) { return; }
  if (document.visibilityState && document.visibilityState !== 'visible') { return; }

  }).catch(function () {});
}, 20000);
